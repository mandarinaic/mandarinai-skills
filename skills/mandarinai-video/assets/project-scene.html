<!doctype html>
<html lang="zh-CN" data-duration="@@DURATION@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<style>
/* Offline, explicitly seekable scene. Brand artwork is the bundled PNG. */
:root{--ink:#172849;--paper:#f6f8ff;--accent:#1b46a2;--highlight:#ffc107;--muted:#566885;--line:#d2dbed;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.scene{height:100%;width:100%;position:relative;padding:7.5vh 7.5vw 12vh;display:flex;flex-direction:column;isolation:isolate}.scene:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 100% 0%,#1b46a21c,transparent 62%),radial-gradient(ellipse at 0% 100%,#ffc10712,transparent 55%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:3vw}.brand{width:clamp(90px,22vw,330px);height:auto;display:block}.edition{font-size:clamp(9px,1.55vw,25px);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600}
.body{display:flex;flex:1;min-height:0;flex-direction:column;justify-content:center;padding:5vh 0;gap:2.6vh}.eyebrow{color:var(--accent);font-size:clamp(11px,2.3vw,36px);font-weight:650;letter-spacing:.12em;text-transform:uppercase}.heading{font-size:clamp(28px,6.8vw,110px);line-height:1.2;letter-spacing:-.04em;margin:0;overflow-wrap:anywhere;font-weight:750}.content{font-size:clamp(22px,5.8vw,94px);line-height:1.8;font-weight:550;overflow-wrap:anywhere;white-space:pre-wrap}.translation{font-size:clamp(14px,2.9vw,47px);line-height:1.5;color:var(--muted);max-width:34em;white-space:pre-wrap}.content:empty,.translation:empty,ul:empty{display:none}ruby{ruby-align:center}rt{font-size:.38em;font-weight:500;letter-spacing:0;color:var(--accent)}
ul{margin:1vh 0 0;padding:0;list-style:none;display:grid;gap:1.8vh}li{display:flex;align-items:flex-start;gap:2vw;padding:2vh 2.5vw;border:1px solid var(--line);background:var(--card);border-radius:1.5vw;font-size:clamp(14px,3.3vw,54px);line-height:1.5}li span{color:var(--accent);font-size:.65em;padding-top:.3em;letter-spacing:.1em;font-weight:700}li div{overflow-wrap:anywhere}
figure{margin:1vh 0;display:flex;align-items:center;justify-content:center;min-height:0;max-height:45vh;overflow:hidden;border:1px solid var(--line);border-radius:2vw;background:var(--card);box-shadow:0 2vh 5vh #17392e12}figure img{display:block;max-width:100%;max-height:44vh;object-fit:contain}.footer{position:absolute;left:7.5vw;right:7.5vw;bottom:6vh;display:flex;gap:2vw;align-items:flex-end;justify-content:space-between;font-size:clamp(10px,1.85vw,30px);color:var(--muted);line-height:1.4}.source{max-width:80%;overflow-wrap:anywhere}.counter{white-space:nowrap;letter-spacing:.15em}.progress{position:absolute;bottom:3.9vh;left:7.5vw;right:7.5vw;height:max(2px,.23vh);background:var(--line);overflow:hidden}.progress span{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.hero .heading,.cta .heading{font-size:clamp(34px,9.6vw,154px)}.hero .content,.cta .content{font-size:clamp(22px,4.7vw,76px)}.hero .body{gap:4vh}.lesson .content{padding:2vh 0 1vh}.facts .heading,.comparison .heading{font-size:clamp(28px,6.2vw,100px)}.comparison ul{grid-template-columns:1fr 1fr}.comparison li{flex-direction:column;gap:1vh}.screenshot .heading{font-size:clamp(25px,5.2vw,84px)}.screenshot .content{font-size:clamp(16px,3.7vw,60px)}.screenshot .body{gap:1.5vh}.cta .body{border-top:2px solid var(--line);margin-top:6vh}.cta .eyebrow{display:inline-block;align-self:flex-start;padding:1vh 2vw;border-radius:8vw;background:var(--highlight);color:#17366e}
.heading:empty{display:none}.presenter-strip{display:flex;align-items:center;gap:2.6vw;flex:0 0 auto;min-height:8vh;max-height:11vh;margin:0 0 1vh;padding:1vh 2.5vw;border:1px solid var(--line);border-radius:2vw;background:var(--card)}.presenter-portrait{height:8vh;width:8vh;max-width:18vw;object-fit:cover;object-position:center 20%;border-radius:50%;flex-shrink:0}.presenter-strip>div{min-width:0}.presenter-name{display:block;font-size:clamp(12px,2.8vw,44px);line-height:1.3}.presenter-role{display:block;font-size:clamp(9px,1.9vw,30px);color:var(--muted);line-height:1.4;overflow-wrap:anywhere}.presenter-strip.is-speaking{border-color:var(--accent)}.has-cast .body{padding:2.5vh 0;gap:2vh}.has-cast.hero .body{gap:2.5vh}.has-cast .heading{font-size:clamp(26px,6.1vw,98px)}.has-cast.hero .heading,.has-cast.cta .heading{font-size:clamp(32px,8.4vw,136px)}.has-cast .content{font-size:clamp(21px,5.2vw,84px)}.has-cast .translation{font-size:clamp(13px,2.6vw,42px)}.has-cast figure{max-height:32vh}.has-cast figure img{max-height:31vh}.has-cast.cta .body{margin-top:3vh}
.dialogue-lines{display:grid;gap:1.6vh;min-height:0}.dialogue-line{display:flex;align-items:flex-start;gap:2.6vw;padding:1.7vh 2.8vw;border:1px solid var(--line);border-radius:2vw;background:var(--card);opacity:.48;transform:none}.dialogue-portrait{width:11vw;height:11vw;max-width:10vh;max-height:10vh;object-fit:cover;object-position:center 20%;border-radius:50%;flex-shrink:0}.dialogue-line>div{min-width:0}.speaker-name{font-size:clamp(10px,2vw,32px);font-weight:650;color:var(--accent);line-height:1.4}.line-chinese{font-size:clamp(20px,4.9vw,80px);line-height:1.9;margin:.4vh 0;overflow-wrap:anywhere}.line-translation{font-size:clamp(12px,2.6vw,42px);line-height:1.45;color:var(--muted);margin:0;overflow-wrap:anywhere}.line-translation:empty{display:none}.dialogue-line.is-past{opacity:1}.dialogue-line.is-active{opacity:1;border-color:var(--accent);box-shadow:inset .7vw 0 var(--accent)}
body.editorial{--paper:#f5f1e8;--ink:#192e54;--accent:#1b46a2;--muted:#636979;--line:#c7c9ce;--card:#faf7f0}.editorial .scene:before{background:linear-gradient(90deg,transparent 49.8%,#1b46a20c 50%,transparent 50.2%)}.editorial .heading{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:700}.editorial .top{padding-bottom:3vh;border-bottom:3px solid var(--ink)}.editorial li,.editorial figure{border-radius:0;box-shadow:none}.editorial li{background:transparent;border-width:1px 0 0;padding-left:0}.editorial .eyebrow{letter-spacing:.2em}.editorial .counter{font-family:Georgia,serif}
body.ink{--paper:#102047;--ink:#f7f8ff;--accent:#ffc107;--muted:#c5d0e8;--line:#465b88;--card:#1d315c}.ink .scene:before{background:radial-gradient(ellipse at 110% 30%,#1b46a2bb,transparent 55%),linear-gradient(120deg,#07152d55,transparent 65%)}.ink .brand{background:#fff;border-radius:.6vw;padding:.6vw}.ink .heading,.ink .content{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif;font-weight:500}.ink .eyebrow{border-left:5px solid var(--accent);padding-left:2vw}.ink li{border:0;border-left:1px solid var(--line);border-radius:0}.ink .progress span{background:var(--highlight)}.ink .cta .eyebrow{border-radius:0;border:0}
@media(min-aspect-ratio:4/3){.scene{padding:7.5vh 7.5vw 14vh}.brand{width:19vw}.edition{font-size:1.3vw}.body{padding:3vh 0;gap:2vh}.eyebrow{font-size:1.5vw}.heading{font-size:5.1vw;max-width:16em}.content{font-size:4.1vw;line-height:1.75;max-width:23em}.translation{font-size:2.1vw}.hero .heading,.cta .heading{font-size:6.8vw;max-width:13em}.hero .content,.cta .content{font-size:2.8vw}.facts .heading,.comparison .heading{font-size:4.7vw}.footer{font-size:1.35vw;bottom:6vh}ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5vh 2vw}li{font-size:2.15vw;padding:1.8vh 1.5vw;border-radius:1vw}.comparison li{flex-direction:row}.screenshot .body{position:relative;padding-right:45%;justify-content:center}.screenshot .heading{font-size:3.8vw}.screenshot .content{font-size:2.8vw}.screenshot .translation{font-size:1.7vw}.screenshot figure{position:absolute;right:0;top:3vh;width:42%;height:calc(100% - 6vh);max-height:none}.screenshot figure img{max-height:100%}.cta .body{margin-top:4vh}}
@media(min-aspect-ratio:9/10) and (max-aspect-ratio:4/3){.heading{font-size:6.7vw}.content{font-size:5.2vw}.translation{font-size:2.7vw}.body{gap:2vh;padding:3vh 0}.hero .heading,.cta .heading{font-size:8vw}.hero .content,.cta .content{font-size:4vw}li{font-size:2.7vw;padding:1.5vh 2vw}ul{gap:1.4vh}.screenshot figure{max-height:35vh}.screenshot figure img{max-height:34vh}}
@media(min-aspect-ratio:4/3){.presenter-strip{align-self:flex-start;max-width:65%;gap:1.5vw;padding:.7vh 1.5vw;border-radius:1vw}.presenter-name{font-size:1.8vw}.presenter-role{font-size:1.2vw}.has-cast .body{padding:2vh 0;gap:1.5vh}.has-cast .heading{font-size:4.5vw}.has-cast.hero .heading,.has-cast.cta .heading{font-size:5.8vw}.has-cast .content{font-size:3.3vw}.has-cast .translation{font-size:1.8vw}.has-cast.screenshot .body{padding-right:45%}.has-cast.screenshot figure{height:calc(100% - 4vh);max-height:none;top:2vh}.has-cast.screenshot figure img{max-height:100%}.dialogue-lines{grid-template-columns:1fr 1fr;gap:2vw}.dialogue-line{gap:1.5vw;padding:1.5vh 1.5vw;border-radius:1vw}.dialogue-portrait{width:6vw;height:6vw;max-width:12vh;max-height:12vh}.speaker-name{font-size:1.5vw}.line-chinese{font-size:3vw}.line-translation{font-size:1.7vw}.dialogue-line.is-active{box-shadow:inset .4vw 0 var(--accent)}}
@media(min-aspect-ratio:9/10) and (max-aspect-ratio:4/3){.presenter-name{font-size:2.4vw}.presenter-role{font-size:1.7vw}.presenter-strip{min-height:8vh;max-height:10vh}.has-cast .body{padding:2vh 0;gap:1.5vh}.has-cast .heading{font-size:5.5vw}.has-cast.hero .heading,.has-cast.cta .heading{font-size:6.8vw}.has-cast .content{font-size:4.2vw}.has-cast .translation{font-size:2.3vw}.dialogue-lines{gap:1.4vh}.dialogue-line{padding:1.2vh 2vw}.dialogue-portrait{height:8vw;width:8vw}.line-chinese{font-size:3.8vw}.line-translation{font-size:2.3vw}.speaker-name{font-size:1.8vw}}
[data-enter]{will-change:transform,opacity}
</style>
</head>
<body class="@@STYLE@@">
<main class="scene @@LAYOUT@@" aria-label="@@HEADING@@">
  <header class="top" data-enter="0"><img class="brand" src="../assets/mandarinai-logo.png" alt="MandarinAi"><span class="edition">@@MODE@@ / 中文学习</span></header>
  <section class="body">
    <div class="eyebrow" data-enter="0.06">@@LABEL@@</div>
    <h1 class="heading" data-enter="0.12" data-cue="heading">@@HEADING@@</h1>
    <div class="content" data-enter="0.25" data-cue="content">@@TEXT@@</div>
    <div class="translation" data-enter="0.38" data-cue="translation">@@TRANSLATION@@</div>
    @@DIALOGUE_HTML@@
    <ul>@@BULLETS@@</ul>
    @@IMAGE@@
  </section>
  @@PRESENTER_HTML@@
  <footer class="footer" data-enter="0.10"><span class="source">@@FOOTER@@</span><span class="counter">@@INDEX@@ / @@COUNT@@</span></footer>
  <div class="progress"><span></span></div>
</main>
<script>
const DATA=@@SCENE_DATA@@;
window.MANDARIN_VIDEO=DATA;
window.cue=function(id,fallback=0){
  const item=DATA.cues?.[id];
  const seconds=typeof item==='number'?item:item?.seconds;
  return Number.isFinite(seconds)?seconds:fallback;
};
const stage=document.querySelector('.scene');
const presenter=document.querySelector('.presenter-strip');
stage.classList.toggle('has-cast',Boolean(presenter));
const profiles=DATA.cast?.characters||DATA.cast||{};
const tracks=Array.isArray(DATA.voice_tracks)?DATA.voice_tracks:[];
const knownTracks=tracks.filter(track=>profiles[track.speaker]);
function updatePresenter(t){
  if(!presenter)return;
  // Hold the last recorded speaker through pauses; before the first utterance,
  // show its speaker. No wall-clock or randomized talking animation is used.
  let current=knownTracks[0];
  for(const track of knownTracks){if(track.start<=t)current=track;else break;}
  const initial=typeof DATA.presenter==='string'?profiles[DATA.presenter]:DATA.presenter;
  const profile=current?profiles[current.speaker]:(profiles[DATA.speaker]||initial);
  if(!profile)return;
  const portrait=presenter.querySelector('.presenter-portrait');
  if(portrait&&profile.portrait){
    const src='../'+profile.portrait;
    if(portrait.getAttribute('src')!==src)portrait.setAttribute('src',src);
    portrait.alt=profile.name||profile.id||'';
  }
  const name=presenter.querySelector('.presenter-name');
  if(name)name.textContent=[profile.name||profile.id,profile.hanzi].filter(Boolean).join(' ');
  const role=presenter.querySelector('.presenter-role');
  if(role)role.textContent=profile.role||'';
  presenter.dataset.speaker=profile.id||current?.speaker||DATA.speaker||'';
  presenter.classList.toggle('is-speaking',Boolean(current&&t>=current.start&&t<current.start+current.duration));
}
// Pure seeking supports captures in any order and never reads wall time.
window.renderAt=function(seconds){
  const duration=Number(document.documentElement.dataset.duration);
  const t=Math.max(0,Math.min(Number(seconds)||0,duration));
  document.querySelectorAll('[data-enter],[data-cue]').forEach(el=>{
    const fallback=Number(el.dataset.enter)||0;
    const start=el.dataset.cue?window.cue(el.dataset.cue,fallback):fallback;
    const p=Math.max(0,Math.min(1,(t-start)/.55));
    const eased=1-Math.pow(1-p,3);
    el.style.opacity=String(eased);
    el.style.transform=`translateY(${(1-eased)*Math.min(innerWidth,innerHeight)*.025}px)`;
  });
  document.querySelectorAll('.dialogue-line').forEach(el=>{
    const start=Number(el.dataset.lineStart),end=Number(el.dataset.lineEnd);
    const recorded=tracks.some(track=>track.speaker===el.dataset.speaker&&t>=track.start&&t<track.start+track.duration&&Math.abs(track.start-start)<.001);
    el.classList.toggle('is-active',recorded&&t>=start&&t<end);
    el.classList.toggle('is-past',t>=end);
  });
  updatePresenter(t);
  document.querySelector('.progress span').style.transform=`scaleX(${Math.min(1,t/duration)})`;
};
window.renderAt(0);
// file:// iframe documents have opaque origins in Chrome. Message passing lets
// the local preview seek without disabling browser origin protection.
window.addEventListener('message',event=>{
  if(event.source===parent && event.data?.type==='mandarinai:seek' && Number.isFinite(event.data.seconds)){
    window.renderAt(event.data.seconds);
  }
});
</script>
</body>
</html>
