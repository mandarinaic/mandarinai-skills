<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Logo Outro · MandarinAi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  body {
    font-family:'Inter Tight','Noto Sans SC',system-ui,sans-serif;
    background: radial-gradient(circle at 50% 45%, #12264f 0%, #05070d 70%);
    color:#f5f5f7;
    margin:0;
    min-height:100vh;
    overflow:hidden;
  }
  /* MandarinAi brand: blue #1b46a2 (lightened to #4a7fd6 on dark bg), accent yellow #ffc107 */
  .accent { color:#ffc107; }
  .ribbon { background:#ffc107; }
  @keyframes logoIn { 0% { opacity:0; transform: scale(1.4) } 100% { opacity:1; transform: scale(1) } }
  @keyframes glow { from { filter: drop-shadow(0 0 0 transparent) } to { filter: drop-shadow(0 0 32px rgba(255,193,7,0.35)) } }
  .logo-wrap { animation: logoIn 1s cubic-bezier(.34,1.56,.64,1) both, glow .8s ease-out 1.1s both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(20px) } to { opacity:1; transform: translateY(0) } }
  .brand { animation: fadeUp .8s ease-out 1.4s both; }
  .tagline { animation: fadeUp .8s ease-out 1.7s both; }
  .meta { animation: fadeUp .6s ease-out 2.1s both; }
  /* shimmer: solid base layer + sweeping highlight, both clipped to text,
     so the wordmark stays visible after the sweep finishes */
  @keyframes shimmer { 0% { background-position:-200% 0, 0 0 } 100% { background-position:200% 0, 0 0 } }
  .shimmer {
    background:
      linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%),
      linear-gradient(#f5f5f7, #f5f5f7);
    background-size: 200% 100%, 100% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 1.8s ease-out 1.9s 1 both;
  }
</style>
</head>
<body class="flex flex-col items-center justify-center relative">
  <div class="ribbon absolute top-0 left-0 right-0" style="height:4px"></div>

  <!-- logo — 真实品牌资产。使用前把 <SKILL_ROOT>/assets/brand/mandarinai-icon.png 拷到场景同目录
       （宽字标版本用 mandarinai-logo.png）。禁止手绘/重绘/用形状拼 logo——任何环境都只合成资产文件 -->
  <div class="logo-wrap relative" style="width:150px;height:150px">
    <img src="mandarinai-icon.png" alt="MandarinAi" style="width:100%;height:100%;object-fit:contain" />
  </div>

  <!-- brand -->
  <h1 class="brand mt-10 font-black tracking-[-0.02em] leading-[0.95]" style="font-size:84px">
    <span class="shimmer">MandarinAi</span>
  </h1>

  <!-- tagline -->
  <p class="tagline mt-4 text-[24px] opacity-70 font-medium">
    Learn Chinese <em class="not-italic accent">the Smart Way</em>
  </p>

  <!-- CTA / meta -->
  <div class="meta mt-12 flex items-center gap-6 text-[11px] uppercase tracking-[0.18em] opacity-50">
    <span>mandarinai.com</span>
    <span class="opacity-40">·</span>
    <span>MandarinAi中文学习网</span>
    <span class="opacity-40">·</span>
    <span>2026</span>
  </div>

  <!-- corner timecode -->
  <div class="absolute bottom-8 right-12 text-[10px] font-mono opacity-30 uppercase tracking-[0.18em]">END · 00:03:21</div>
  <div class="absolute bottom-8 left-12 text-[10px] font-mono opacity-30 uppercase tracking-[0.18em]">FRAME · LOGO-OUTRO</div>
</body>
</html>
